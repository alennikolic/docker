# ./haproxy/docker-compose.yml

name: haproxy

services:
  haproxy:
    image: haproxy:${HAPROXY_VERSION}
    container_name: haproxy
    restart: unless-stopped
    ports:
      - "${HAPROXY_HTTP_PORT}:80"
      - "${HAPROXY_HTTPS_PORT}:443"
      - "${HAPROXY_STATS_PORT}:8404"
    environment:
      HAPROXY_STATS_USER: ${HAPROXY_STATS_USER}
      HAPROXY_STATS_PASSWORD: ${HAPROXY_STATS_PASSWORD}
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/usr/local/etc/haproxy/certs:ro
      - /etc/localtime:/etc/localtime:ro
    sysctls:
      # Dozvoljava non-root procesu u kontejneru da otvori portove 80 i 443
      - net.ipv4.ip_unprivileged_port_start=0
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - haproxy-net

networks:
  haproxy-net:
    driver: bridge
