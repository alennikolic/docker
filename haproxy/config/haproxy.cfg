# ./haproxy/config/haproxy.cfg

#---------------------------------------------------------------------
# Globalna podesavanja
#---------------------------------------------------------------------
global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    # SSL podrazumevana podesavanja
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    tune.ssl.default-dh-param 2048

#---------------------------------------------------------------------
# Podrazumevane vrednosti za sve frontend/backend sekcije
#---------------------------------------------------------------------
defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout check 5s

#---------------------------------------------------------------------
# Stats stranica - pregled backend servera i saobracaja
# Kredencijali dolaze iz .env fajla preko environment promenljivih
#---------------------------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}

#---------------------------------------------------------------------
# HTTP frontend
#---------------------------------------------------------------------
frontend http_in
    bind *:80

    # Preusmeravanje na HTTPS - otkomentarisi kada podesis sertifikat
    # http-request redirect scheme https unless { ssl_fc }

    # Rutiranje po domenu
    acl host_app   hdr(host) -i app.primer.rs
    acl host_admin hdr(host) -i admin.primer.rs

    use_backend app_servers   if host_app
    use_backend admin_servers if host_admin

    default_backend app_servers

#---------------------------------------------------------------------
# HTTPS frontend
# Zahteva PEM fajl (sertifikat + privatni kljuc) u ./certs folderu
# Otkomentarisi ceo blok kada dodas sertifikat
#---------------------------------------------------------------------
# frontend https_in
#     bind *:443 ssl crt /usr/local/etc/haproxy/certs/
#
#     http-response set-header Strict-Transport-Security "max-age=31536000"
#
#     acl host_app   hdr(host) -i app.primer.rs
#     acl host_admin hdr(host) -i admin.primer.rs
#
#     use_backend app_servers   if host_app
#     use_backend admin_servers if host_admin
#
#     default_backend app_servers

#---------------------------------------------------------------------
# Backend serveri - zameni IP adrese svojima
#---------------------------------------------------------------------
backend app_servers
    balance roundrobin
    option httpchk
    http-check send meth GET uri /
    http-check expect status 200

    server app1 192.168.1.10:8080 check inter 5s fall 3 rise 2
    server app2 192.168.1.11:8080 check inter 5s fall 3 rise 2

backend admin_servers
    balance leastconn
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200

    server admin1 192.168.1.20:3000 check inter 5s fall 3 rise 2
