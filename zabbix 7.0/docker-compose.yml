name: zabbix-70

services:
  mysql-server:
    image: mysql:8.0-oracle
    container_name: zabbix70-mysql
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=mysql_native_password
      - --skip-log-bin
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - zabbix-net

  zabbix-java-gateway:
    image: zabbix/zabbix-java-gateway:alpine-7.0-latest
    container_name: zabbix70-java-gateway
    restart: unless-stopped
    environment:
      ZBX_START_POLLERS: 5
    networks:
      - zabbix-net

  zabbix-web-service:
    image: zabbix/zabbix-web-service:alpine-7.0-latest
    container_name: zabbix70-web-service
    restart: unless-stopped
    environment:
      ZBX_ALLOWEDIP: zabbix-server,mysql-server,zabbix-web
    cap_add:
      - SYS_ADMIN
    networks:
      - zabbix-net

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zabbix70-server
    restart: unless-stopped
    depends_on:
      mysql-server:
        condition: service_healthy
      zabbix-java-gateway:
        condition: service_started
      zabbix-web-service:
        condition: service_started
    environment:
      DB_SERVER_HOST: mysql-server
      DB_SERVER_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ZBX_JAVAGATEWAY_ENABLE: "true"
      ZBX_JAVAGATEWAY: zabbix-java-gateway
      ZBX_JAVAGATEWAYPORT: 10052
      ZBX_STARTJAVAPOLLERS: 5
      ZBX_STARTREPORTWRITERS: 1
      ZBX_WEBSERVICEURL: http://zabbix-web-service:10053/report
      ZBX_CACHESIZE: 64M
      ZBX_TIMEOUT: 10
    ports:
      - "${ZBX_SERVER_PORT}:10051"
    volumes:
      - ./data/alertscripts:/usr/lib/zabbix/alertscripts:ro
      - ./data/externalscripts:/usr/lib/zabbix/externalscripts:ro
      - ./data/export:/var/lib/zabbix/export
      - ./data/snmptraps:/var/lib/zabbix/snmptraps
      - /etc/localtime:/etc/localtime:ro
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix70-web
    restart: unless-stopped
    depends_on:
      mysql-server:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      DB_SERVER_HOST: mysql-server
      DB_SERVER_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PHP_TZ: ${PHP_TZ}
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME}
    ports:
      - "${ZBX_WEB_PORT}:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - zabbix-net

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix70-agent
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
    privileged: true
    pid: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - zabbix-net

networks:
  zabbix-net:
    driver: bridge
