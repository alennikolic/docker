; ./wordpress/config/uploads.ini

; Podrazumevani PHP limit je 2 MB, sto je premalo za teme i plugin-ove
file_uploads = On
upload_max_filesize = 256M
post_max_size = 256M
max_file_uploads = 20

; Vise vremena i memorije za import sadrzaja i azuriranja
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000
